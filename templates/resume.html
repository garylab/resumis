<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ seo.title }} - {{ sitename }}</title>
  <meta name="keywords" content="{{seo.keywords}}">
  <meta name="description" content="{{seo.description}}">
  <meta property="og:locale" content="en">
  <meta property="og:url" content="{{seo.canonical}}">
  <meta property="og:title" content="{{ seo.title }} - {{ sitename }}">
  <meta property="og:description" content="{{seo.description}}">
  <link rel="canonical" href="{{seo.canonical}}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  {% include 'global/head.html' %}
  <link rel="stylesheet" href="{{url_for('static', filename='css/editor.css')}}">
</head>
<body class="bg-gray-50 resume-editor-page">
<main class="editor-main">
  <form id="saveResume" class="editor-form" action="{{url_for('resume.save')}}" method="post">
    <input type="hidden" name="oldName" value="{{old_name}}">
    <div class="editor-workspace">
      <section class="editor-panel markdown-panel" aria-label="Markdown">
        <label class="sr-only" for="resume-markdown">Resume Markdown</label>
        <textarea id="resume-markdown" name="content">{{content}}</textarea>
      </section>

      <section class="editor-panel preview-panel" aria-label="Live preview">
        <div id="preview-stage" class="preview-stage">
          <div id="preview-scroll" class="preview-scroll">
            <div id="preview-sheet" class="preview-sheet">
              <iframe id="preview" title="Resume preview" sandbox="allow-same-origin allow-modals"></iframe>
            </div>
          </div>
        </div>
      </section>

      <aside class="editor-panel appearance-panel" aria-label="Appearance">
        <div class="editor-bar">
          <a class="icon-btn" href="{{url_for('resume.get_resumes')}}" aria-label="Back to My Resumes"
             title="Back to My Resumes"><svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#house"></use></svg></a>
          <div class="editor-actions">
            <button type="submit" class="action-button action-outline">Save</button>
            <button type="button" id="export-pdf" class="action-button action-accent"><svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#download"></use></svg> PDF</button>
          </div>
        </div>

        <div class="appearance-scroll">
          <div class="editor-title">
            <button type="button" id="name-text" class="resume-name" title="Rename resume">{{name}} <svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#pencil"></use></svg></button>
            <label class="sr-only" for="name-input">Resume name</label>
            <textarea id="name-input" name="name" rows="1" class="rounded-md border border-gray-300 px-3 py-2 hidden!">{{name}}</textarea>
          </div>

          <div id="paper-section"></div>
          <fieldset class="style-section">
            <legend>Photo<button type="button" id="photo-help-button" class="ml-1 inline-flex align-middle text-gray-400 hover:text-gray-600" aria-label="Photo requirements" aria-describedby="photo-help-tooltip"><svg class="icon" aria-hidden="true"><use href="/static/img/icons.svg#circle-alert"></use></svg></button></legend>
            <div class="relative">
              <span id="photo-help-tooltip" role="tooltip" class="photo-help-tooltip">JPG, PNG or WebP, up to 10 MB. Cropped to a square.</span>
              <input type="hidden" id="photo-data" name="photo" value="{{photo}}">
              <div class="flex items-center gap-3">
                <img id="photo-thumbnail" class="hidden h-14 w-14 rounded-md object-cover" alt="Your resume photo">
                <div class="flex flex-wrap items-center gap-2">
                  <button type="button" id="upload-photo" class="action-button action-outline text-xs">Upload</button>
                  <button type="button" id="remove-photo" class="hidden text-xs text-gray-500 underline">Remove photo</button>
                </div>
              </div>
              <label class="sr-only" for="photo-file">Choose resume photo</label>
              <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
              <div id="photo-shape" class="mt-3 style-switch" role="radiogroup" aria-label="Photo shape"></div>
              <p id="photo-status" class="mt-2 mb-0 text-xs text-gray-500" role="status" aria-live="polite"></p>
            </div>
          </fieldset>
          <fieldset class="style-section">
            <legend>Quick styles</legend>
            <div id="style-presets" class="style-presets"></div>
          </fieldset>
          <div id="style-controls"></div>
          <div class="style-section style-reset">
            <button type="button" id="reset-style" class="reset-style">Reset visual adjustments</button>
            <span id="style-status" class="sr-only" role="status" aria-live="polite"></span>
          </div>
          <details id="advanced-css" class="style-section advanced-css">
            <summary>Advanced CSS</summary>
            <p>For extra customization. Your existing CSS is kept when you use the controls above.</p>
            <label class="sr-only" for="resume-css">Resume CSS</label>
            <textarea id="resume-css" name="style">{{style}}</textarea>
          </details>
        </div>
      </aside>

      <div class="col-resizer" data-edge="markdown" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="Resize the Markdown panel"></div>
      <div class="col-resizer" data-edge="appearance" role="separator" tabindex="0"
           aria-orientation="vertical" aria-label="Resize the appearance panel"></div>
    </div>
  </form>
</main>

{% include 'global/scripts.html' %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script type="module" src="{{url_for('static', filename='js/editor.js')}}"></script>
</body>
</html>
