<!DOCTYPE html>
<html lang="en">
<head>
    <title>Select Github Repository - {{sitename}}</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    {% include 'global/head.html' %}
</head>
<body class="bg-gray-50">
{% include 'global/navbar.html' %}

<main class="content">
    <div class="my-12">
        <div class="mx-auto w-full max-w-[960px] px-3">
            <h1 class="my-12 text-center">Select a repository and branch to continue.</h1>

            <form action="{{ url_for('repo.save') }}" method="post">
                <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
                    <div class="min-w-0 md:col-span-2">
                        <div class="mb-4">
                            <label for="repoSelect" class="mb-2 block">Select Repository</label>
                            <select id="repoSelect" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 disabled:bg-gray-100" name="repo">
                                <option value="" selected disabled>Select a repository</option>
                                {% for repo in repos %}
                                <option value="{{ repo.full_name }}"
                                        {% if repo.full_name == selected_repo.full_name %} selected {% endif %}
                                >{{ repo.full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="min-w-0 min-w-0">
                        <div class="mb-4">
                            <label for="branchSelect" class="mb-2 block">Select Branch</label>
                            <select id="branchSelect" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 disabled:bg-gray-100" name="branch" disabled>
                                <option value="" selected disabled>Select a branch</option>
                                <!-- Options will be populated dynamically -->
                            </select>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 gap-6 my-6">
                    <div class="min-w-0">
                        <div class="mb-4 text-center">
                            <button type="submit" class="action-button text-sm bg-blue-600 text-white hover:bg-blue-700 me-2">Save</button>
                        </div>
                    </div>
                </div>
            </form>

        </div>
    </div>
</main>


{% include 'global/footer.html' %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const repoSelect = document.getElementById('repoSelect');
        const branchesApiUrl = '{{ url_for('repo.get_branches') }}';
        const defaultBranch = {{ selected_repo.branch | tojson }};

        if (repoSelect.value) {
            fetchBranches(branchesApiUrl + '?repo=' + encodeURIComponent(repoSelect.value), defaultBranch);
        }

        repoSelect.addEventListener('change', function (e) {
            fetchBranches(branchesApiUrl + '?repo=' + encodeURIComponent(e.currentTarget.value));
        });
    });

    initFormSubmits();
</script>
</body>
</html>
