<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Resumes - {{sitename}}</title>
  <meta name="keywords" content="">
  <meta name="description" content="">

  {% include 'global/head.html' %}
</head>
<body class="bg-light">
  {% include 'global/navbar.html' %}

  <main class="container content">
    <h2 class="text-center mt-5">My Resumes</h2>

    <div class="d-flex my-4 justify-content-between">
      <div class="fw-light text-muted">
        <a class="me-2" href="https://github.com/{{repo.full_name}}/tree/{{repo.branch}}" target="_blank" rel="nofollow">
          <i class="small bi bi-github"></i> {{repo.full_name}} *{{repo.branch}}</a>

        [<a class="small" href="{{url_for('repo.get_repos')}}">Change Repository</a>]

      </div>

      <a class="ms-2 btn btn-sm btn-yellow" href="{{url_for('home.create')}}">New</a>
    </div>

    <div class="d-flex flex-wrap mt-4">


      {% for resume in resumes %}
      <div class="card border-0 bg-transparent me-3" style="width: 12rem">
          <div class="card-image-container">
            <a href="{{url_for('resume.edit', name=resume)}}">
              <img src="{{url_for('static', filename='img/screenshots/data-scientist.png')}}"
                   class="card-img-top border radius" alt="{{resume}}" title="{{resume}}">
            </a>

              <div class="hover-buttons">
                  <a class="btn btn-sm btn-primary" href="https://github.com/{{repo.full_name}}/blob/{{repo.branch}}/{{resume}}"
                     data-bs-toggle="tooltip" data-bs-title="View on GitHub"
                     target="_blank" rel="nofollow"><i class="bi bi-box-arrow-up-right"></i></a>

                  <form action="{{url_for('resume.duplicate')}}" method="post">
                    <input type="hidden" name="name" value="{{resume}}">
                    <button type="submit" class="btn btn-sm btn-warning"
                       data-bs-toggle="tooltip" data-bs-title="Duplicate"
                    ><i class="bi bi-copy"></i></button>
                  </form>

                  <div class="btn-group">
                      <button class="btn btn-sm btn-danger dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-trash"></i></button>
                      <ul class="dropdown-menu confirm-delete">
                          <li>
                            <form action="{{url_for('resume.delete')}}" method="post">
                              <input type="hidden" name="name" value="{{resume}}">
                              <button type="submit" role="button" class="dropdown-item small remove-item small">Confirm</button>
                            </form>
                          </li>
                      </ul>
                  </div>
              </div>
          </div>

        <div class="card-body px-0">
          <p class="card-title text-center">
            <a href="{{url_for('resume.edit', name=resume)}}">
              {{resume}}
            </a>
          </p>
        </div>
      </div>
      {% endfor %}

    </div>
  </main>

  {% include 'global/footer.html' %}
  <script type="application/javascript">
    initFormSubmits();
  </script>
</body>
</html>
