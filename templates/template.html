<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{resume.name}} Resume Template - {{sitename}}</title>
  <meta name="keywords" content="{{resume.name}} Resume, Resume Template">
  <meta name="description" content="Create a {{resume.name}} resume from free template in 5 minutes, and save it to your own Github easily!">

  <meta property="og:locale" content="en">
  <meta property="og:url" content="{{url_for('home.template', slug=to_slug(resume.name), _external=True)}}">
  <meta property="og:title" content="{{resume.name}} Resume Template - {{sitename}}">
  <meta property="og:description"
        content="Create a {{resume.name}} resume from free template in 5 minutes, and save it to your own Github easily!">

  <link rel="canonical" href="{{url_for('home.template', slug=to_slug(resume.name), _external=True)}}"/>

  {% include 'global/head.html' %}
</head>
<body class="bg-light template-page">
  {% include 'global/navbar.html' %}

  <main class="container content">
    <h1 class="text-center mt-5 mb-4">{{resume.name}} Resume Template</h1>
    <div class="text-center">
      <a class="btn btn-outline-yellow" href="{{url_for('home.create_from_template', template_slug=to_slug(resume.name))}}">
        Use This Template
      </a>
    </div>

    <div id="template-preview" class="template-preview my-4 mx-auto">
      <div id="template-sheet" class="template-sheet">
        <iframe id="resume-content" title="{{resume.name}} resume preview"
                sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                srcdoc="<!doctype html><html lang='en'><head><meta charset='utf-8'><title>Resume preview</title><style>{{resume.css}}</style></head><body>{{resume.html}}</body></html>"></iframe>
      </div>
    </div>

    <div class="text-center my-4">
      <a class="btn btn-outline-yellow" href="{{url_for('home.create_from_template', template_slug=to_slug(resume.name))}}">
          Use This Template
      </a>
    </div>
  </main>

  {% include 'global/footer.html' %}
  <script type="module" src="{{url_for('static', filename='js/template-preview.js')}}"></script>
</body>
</html>
